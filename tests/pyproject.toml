[project]
name = "tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: reboots the board (about a minute)",
    "console: needs the board's serial console",
]
