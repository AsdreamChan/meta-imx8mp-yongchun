# Config fragment merged into meta-swupdate's defconfig (swupdate.inc runs
# merge_config.sh over every .cfg in SRC_URI).
#
# swupdate.service is Type=notify, but swupdate only sends READY=1 when
# built with CONFIG_SYSTEMD (core/swupdate.c); without it systemd would
# wait for the daemon until the start timeout.
CONFIG_SYSTEMD=y
# Check the sha256 that sw-description gives for each image.
CONFIG_HASH_VERIFY=y
# The handler for sw-description's bootenv section. CONFIG_UBOOT only
# selects libubootenv as the bootloader interface; without this handler
# the parser rejects any sw-description that sets bootloader variables
# (core/parser.c:203-211).
CONFIG_BOOTLOADERHANDLER=y
# Verify sw-description.sig against the public key that 08-yongchun-key
# passes with -k; a .swu whose sw-description is unsigned, or signed with
# another key, is refused before anything is written. With signing on,
# every image in sw-description must carry a sha256 (check_missing_hash in
# core/parser.c), so the signature covers the images as well. RSA
# PKCS#1.5, as in NXP's AN13872 (section 5.4.3).
CONFIG_SIGNED_IMAGES=y
CONFIG_SIGALG_RAWRSA=y
