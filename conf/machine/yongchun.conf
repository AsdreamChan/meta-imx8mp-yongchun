#@TYPE: Machine
#@NAME: yongchun
#@SOC: i.MX8MP
#@DESCRIPTION: FRDM-IMX8MPLUS derivative for the yongchun BSP

# Keep the FRDM overrides available to other layers. Without this, anything
# written as VAR:imx8mp-lpddr4-frdm elsewhere would stop applying.
MACHINEOVERRIDES =. "imx8mp-lpddr4-frdm:"

require conf/machine/imx8mp-lpddr4-frdm.conf

# The vendor machine builds ten device trees for camera, audio and panel
# variants that are not fitted. Keep the board's own and the jailhouse inmate.
KERNEL_DEVICETREE = " \
    freescale/imx8mp-frdm.dtb \
    freescale/imx8mp-jailhouse-inmate.dtb \
"

# imx8mp-lpddr4-frdm.conf:25 adds ten device trees with :append:use-nxp-bsp.
# An append is a separate layer from the base value, so the assignment above
# does not displace it. Remove it with the same override tag.
KERNEL_DEVICETREE:remove:use-nxp-bsp = " \
    freescale/imx8mp-frdm-8mic-revE.dtb \
    freescale/imx8mp-frdm-ap1302-dual.dtb \
    freescale/imx8mp-frdm-boe-wuxga-lvds0-panel.dtb \
    freescale/imx8mp-frdm-boe-wuxga-lvds1-panel.dtb \
    freescale/imx8mp-frdm-os08a20.dtb \
    freescale/imx8mp-frdm-os08a20-dual.dtb \
    freescale/imx8mp-frdm-root.dtb \
    freescale/imx8mp-frdm-rpmsg.dtb \
    freescale/imx8mp-frdm-waveshare-7inch-c-panel.dtb \
"
