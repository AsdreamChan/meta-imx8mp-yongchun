#@TYPE: Machine
#@NAME: yongchun
#@SOC: i.MX8MP
#@DESCRIPTION: FRDM-IMX8MPLUS derivative for the yongchun BSP

# Keep the FRDM overrides available to other layers. Without this, anything
# written as VAR:imx8mp-lpddr4-frdm elsewhere would stop applying.
MACHINEOVERRIDES =. "imx8mp-lpddr4-frdm:"

require conf/machine/imx8mp-lpddr4-frdm.conf

# The vendor machine builds ten device trees for camera, audio and panel
# variants that are not fitted. Keep the board's own and the jailhouse inmate.
# imx8mp-jailhouse-inmate.dtb ends up listed twice: once here and once
# from the vendor's KERNEL_DEVICETREE:append:use-nxp-bsp in
# imx8mp-lpddr4-frdm.conf. It cannot go into the :remove below, because
# :remove deletes every occurrence of a word, including the one set here.
# The duplicate is harmless; the same dtb is just deployed twice.
KERNEL_DEVICETREE = " \
    freescale/imx8mp-frdm.dtb \
    freescale/imx8mp-jailhouse-inmate.dtb \
    freescale/imx8mp-frdm-lcd1602.dtbo \
    freescale/imx8mp-frdm-lcd1602.dtb \
    freescale/imx8mp-frdm-tpg.dtbo \
    freescale/imx8mp-frdm-tpg.dtb \
"

# imx8mp-lpddr4-frdm.conf:25 adds ten device trees with :append:use-nxp-bsp.
# An append is a separate layer from the base value, so the assignment above
# does not displace it. Remove it with the same override tag.
KERNEL_DEVICETREE:remove:use-nxp-bsp = " \
    freescale/imx8mp-frdm-8mic-revE.dtb \
    freescale/imx8mp-frdm-ap1302-dual.dtb \
    freescale/imx8mp-frdm-boe-wuxga-lvds0-panel.dtb \
    freescale/imx8mp-frdm-boe-wuxga-lvds1-panel.dtb \
    freescale/imx8mp-frdm-os08a20.dtb \
    freescale/imx8mp-frdm-os08a20-dual.dtb \
    freescale/imx8mp-frdm-root.dtb \
    freescale/imx8mp-frdm-rpmsg.dtb \
    freescale/imx8mp-frdm-waveshare-7inch-c-panel.dtb \
"

# Boot through extlinux.conf so pluggable modules can be added as overlays
# without rebuilding the device tree (ADR-0007). U-Boot's bootflow scan
# finds /extlinux/extlinux.conf on the boot partition before NXP's
# bsp_bootcmd runs; with the file absent, the board boots as before.
UBOOT_EXTLINUX = "1"
# Absolute paths on the FAT boot partition, where the kernel and device
# trees are. The class defaults are relative to /boot/extlinux in the
# root filesystem, where they are not.
UBOOT_EXTLINUX_KERNEL_IMAGE = "/Image"
UBOOT_EXTLINUX_FDT = "/imx8mp-frdm-tpg.dtb"
UBOOT_EXTLINUX_FDTOVERLAYS = "/imx8mp-frdm-bmp280.dtbo"
UBOOT_EXTLINUX_ROOT = "root=/dev/mmcblk1p2"
# The default, console=${console},${baudrate}, is expanded by U-Boot, and
# this board's console already carries the baud rate.
UBOOT_EXTLINUX_CONSOLE = "console=ttymxc1,115200"
IMAGE_BOOT_FILES:append = " extlinux.conf;extlinux/extlinux.conf \
    devicetree/imx8mp-frdm-bmp280.dtbo;imx8mp-frdm-bmp280.dtbo"
