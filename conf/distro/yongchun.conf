# yongchun — headless BSP distro for the FRDM-IMX8MPLUS
#
# Based on NXP's minimal xwayland distro, which relative to the full one drops
# qt, jailhouse and xen (the only difference between them is one require of
# fsl-imx-extended.inc). Jailhouse is added back; the display stack is removed
# because nothing in weeks 5-8 needs it, and leaving it in means week 8 would
# measure boot time for software that will never ship.

require conf/distro/fsl-imx-xwayland-minimal.conf

DISTRO = "yongchun"
DISTRO_NAME = "yongchun BSP distro"
DISTRO_VERSION = "1.0"

DISTRO_FEATURES:append = " jailhouse"
DISTRO_FEATURES:remove = "wayland x11 virtualization"
